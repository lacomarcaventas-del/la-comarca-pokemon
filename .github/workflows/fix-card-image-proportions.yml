name: Fix catalog image proportions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply image layout fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/globals.css')
          s=p.read_text()
          marker='/* Catalog image proportion fix */'
          if marker not in s:
              s += '\n\n'+marker+'\n.cardImage{aspect-ratio:1.25;min-height:0;}\n.cardImage img{width:100%;height:100%;object-fit:contain;display:block;padding:10px;}\n'
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css
          git diff --cached --quiet || git commit -m 'Fix catalog image proportions'
          git push
