name: Fix Ronin code overlay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('components/Catalog.tsx')
          s=p.read_text()
          new='''function CatalogImage({src,alt}:{src:string,alt:string}){const color=src.startsWith("http")?roninColorName(alt):null;return <div className="cardImage" style={{position:"relative",overflow:"hidden"}}><img src={catalogImageSrc(src)} alt={alt}/>{color&&<span aria-hidden="true" style={{position:"absolute",left:"54%",top:"40%",width:"40%",height:"9%",display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.98)",color:"#202124",fontSize:"10px",fontWeight:700,lineHeight:1.1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",pointerEvents:"none"}}>{color}</span>}</div>}\n'''
          s2=re.sub(r'function CatalogImage\(\{src,alt\}:\{src:string,alt:string\}\)\{.*?\}\nexport default function Catalog', new+'export default function Catalog', s, count=1, flags=re.S)
          if s2==s: raise SystemExit('CatalogImage pattern not found')
          p.write_text(s2)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/Catalog.tsx
          git commit -m 'Fix Ronin code area without adding a label' || exit 0
          git push
          git rm .github/workflows/fix-ronin-label-v2.yml
          git commit -m 'Remove temporary Ronin patch workflow'
          git push
