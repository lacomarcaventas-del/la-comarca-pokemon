name: Fix Catalog syntax
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated JSX tail
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/Catalog.tsx')
          s=p.read_text()
          bad='</div>} alt={alt}/></div>;}'
          if bad not in s:
              raise SystemExit('Expected duplicated JSX tail not found')
          s=s.replace(bad,'</div>}')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/Catalog.tsx
          git commit -m 'Fix Catalog JSX syntax'
          git push
