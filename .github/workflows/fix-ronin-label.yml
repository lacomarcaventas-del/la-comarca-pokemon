name: Fix Ronin labels without redrawing images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Ronin overlay with code-only mask
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('components/Catalog.tsx')
          s=p.read_text()
          new='''function CatalogImage({src,alt}:{src:string,alt:string}){\n  const color=roninColorName(alt);\n  const isRonin=!!color && /Ronin Acrylics/i.test(alt) && /lc-\\d+\\.jpg/i.test(src);\n  return <div className="cardImage" style={{position:"relative",overflow:"hidden"}}>\n    <img src={catalogImageSrc(src)} alt={alt}/>\n    {isRonin&&<span aria-hidden="true" style={{position:"absolute",left:"58%",top:"51%",width:"38%",height:"7%",display:"block",background:"#fff",pointerEvents:"none"}} />}\n  </div>\n}\n'''
          pattern=r'function CatalogImage.*?export default function Catalog'
          s2=re.sub(pattern,lambda m:new+'export default function Catalog',s,count=1,flags=re.S)
          if s2==s:
              raise SystemExit('CatalogImage pattern not found')
          p.write_text(s2)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Catalog.tsx
          git commit -m "Fix Ronin code-only image mask"
          git rm .github/workflows/fix-ronin-label.yml
          git commit -m "Remove temporary Ronin patch workflow"
          git push
