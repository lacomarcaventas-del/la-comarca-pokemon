name: Fix inventory validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/admin/inventario/page.tsx")
          s = p.read_text(encoding="utf-8")
          old = 'function validate(data:Row[]){const out:string[]=[];data.forEach((r,i)=>{'
          new = 'function validate(data:Row[]){const out:string[]=[];data.forEach((r,i)=>{if(REQUIRED.every(k=>String(r[k]??"").trim()===""))return;'
          if old not in s:
              raise SystemExit("Expected validation code was not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-inventory-validation.yml
          git add app/admin/inventario/page.tsx .github/workflows/fix-inventory-validation.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix empty inventory template rows"
          git push