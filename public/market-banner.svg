<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">La Comarca Market — Buy Sell Trade</title>
<desc id="desc">Banner bilingüe para compra, venta e intercambio de colecciones TCG.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050819"/><stop offset=".55" stop-color="#091321"/><stop offset="1" stop-color="#16051f"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32eaff"/><stop offset=".55" stop-color="#738cff"/><stop offset="1" stop-color="#ff3be7"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16263a"/><stop offset="1" stop-color="#07101c"/></linearGradient>
</defs>
<rect width="1600" height="520" rx="28" fill="url(#bg)"/>
<path d="M0 420 C420 310 700 500 1040 350 S1400 270 1600 330" fill="none" stroke="#00eaff" stroke-opacity=".14" stroke-width="2"/>
<path d="M0 455 C400 345 720 520 1100 375 S1420 300 1600 360" fill="none" stroke="#ff20e7" stroke-opacity=".13" stroke-width="2"/>
<g opacity=".9">
  <rect x="970" y="140" width="250" height="330" rx="18" fill="url(#card)" stroke="#00eaff" stroke-opacity=".55" transform="rotate(8 1095 305)"/>
  <rect x="1080" y="105" width="250" height="330" rx="18" fill="url(#card)" stroke="#ff20e7" stroke-opacity=".5" transform="rotate(17 1205 270)"/>
  <rect x="1185" y="145" width="250" height="330" rx="18" fill="url(#card)" stroke="#00eaff" stroke-opacity=".45" transform="rotate(24 1310 310)"/>
  <circle cx="1110" cy="275" r="72" fill="none" stroke="url(#neon)" stroke-width="4" filter="url(#glow)"/>
  <path d="M1068 275h84M1110 233v84" stroke="#fff" stroke-opacity=".8" stroke-width="3"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" fill="#fff">
  <text x="72" y="92" font-size="22" letter-spacing="8" fill="#8defff">LA COMARCA</text>
  <text x="68" y="190" font-size="92" font-weight="900" letter-spacing="-2">MARKET</text>
  <rect x="70" y="216" width="480" height="4" rx="2" fill="url(#neon)"/>
  <text x="72" y="270" font-size="31" font-weight="800">COMPRA · VENDE · INTERCAMBIA</text>
  <text x="72" y="310" font-size="21" letter-spacing="7" fill="#bfefff">BUY · SELL · TRADE</text>
  <text x="72" y="370" font-size="27" font-weight="700">Tu colección puede llegar más lejos.</text>
  <text x="72" y="406" font-size="23" fill="#b9d8ee">Your collection can go further.</text>
  <g transform="translate(1180 70) rotate(-7)"><rect x="0" y="0" width="300" height="170" rx="8" fill="#efe3c2" opacity=".96"/><text x="150" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#2b2118">La paciencia</text><text x="150" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="#2b2118">es requerida...</text><path d="M70 88h160" stroke="#d82ad8" stroke-width="3"/><text x="150" y="115" text-anchor="middle" font-size="14" fill="#3b3026">Grandes colecciones toman</text><text x="150" y="136" text-anchor="middle" font-size="14" fill="#3b3026">tiempo, y las buenas historias también.</text><text x="150" y="158" text-anchor="middle" font-size="11" fill="#3b3026">Patience is required...</text></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#fff" text-anchor="middle">
  <text x="1330" y="75" font-size="18" fill="#8defff">COLECCIONISTAS</text>
  <text x="1330" y="100" font-size="18" fill="#8defff">CONECTANDO COLECCIONES</text>
  <text x="1330" y="125" font-size="18" fill="#8defff">COLLECTORS · CONNECTING COLLECTIONS</text>
</g>
</svg>